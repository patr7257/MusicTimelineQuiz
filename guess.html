<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hitster: Bonus guess</title>
  <style>
    @font-face {
      font-family: "Righteous";
      src: url("fonts/righteous.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      /* Vinyl Lounge palette (issue #32), matched to index.html. Variable NAMES
         kept from the old theme so the existing rules keep resolving. */
      --cream: #f3e7cf;
      --paper: #faf1dd;
      --paper-deep: #ecdcbc;
      --orange: #c1502e;
      --orange-deep: #93381e;
      --gold: #d9a441;
      --gold-deep: #a87a24;
      --brown: #3b2a1e;
      --brown-deep: #241710;
      --avocado: #7a8450;
      --avocado-deep: #59623a;

      --bg0: #241710;
      --bg1: #3b2a1e;
      --ink: #f3e7cf;
      --muted: #cbb187;
      --accent: #c1502e;
      --accent2: #d9a441;
      --warm: #d9a441;
      --good: #59623a;
      --bad: #93381e;
      --panel: #faf1dd;
      --line: rgba(59, 42, 30, 0.28);
      --shadow: 0 14px 30px rgba(36, 23, 16, 0.45);
      --radius: 18px;

      --disp: "Righteous", "Trebuchet MS", "Segoe UI", sans-serif;
      --body-font: Georgia, "Times New Roman", "Segoe UI", serif;
      --wood: linear-gradient(rgba(36, 23, 16, 0.18), rgba(36, 23, 16, 0.34)), repeating-linear-gradient(92deg, #6b4529 0 6px, #7a5334 6px 11px, #5e3c23 11px 15px, #74502f 15px 22px, #654226 22px 27px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--body-font);
      color: var(--ink);
      background:
        radial-gradient(1000px 700px at 50% -12%, #4a3320 0%, rgba(74,51,32,0) 58%),
        linear-gradient(168deg, var(--bg1), var(--bg0));
      min-height: 100%;
      padding: 20px 16px 40px;
    }
    button { font-family: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    /* Themed scrollbars (issue #30 item 9): cream track, wood/gold thumb */
    * { scrollbar-width: thin; scrollbar-color: var(--gold) var(--paper-deep); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--paper-deep); border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); border-radius: 999px; border: 2px solid var(--paper-deep); }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-deep); }

    .wrap { max-width: 480px; margin: 0 auto; }
    .brand { font-family: var(--disp); font-weight: 400; letter-spacing: 1.5px; font-size: 22px; color: var(--paper); text-shadow: 2px 2px 0 var(--orange-deep); display: flex; align-items: center; gap: 9px; margin-bottom: 18px; }
    .brand .note { color: var(--gold); text-shadow: none; }
    .panel {
      background: linear-gradient(160deg, #fdf6e6, var(--paper) 60%, var(--paper-deep));
      border: 3px solid var(--brown); border-radius: 22px; padding: 22px; color: var(--brown);
      box-shadow: var(--shadow), inset 0 0 0 5px var(--paper), inset 0 0 0 7px rgba(217,164,65,.28);
    }
    .lede { margin: 0 0 18px; color: rgba(59,42,30,.75); font-size: 14px; line-height: 1.5; }
    .names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .name-btn {
      font-family: var(--disp); letter-spacing: .5px; border: 2px solid var(--brown-deep); background: var(--paper-deep); color: var(--brown);
      padding: 16px 10px; border-radius: 12px; font-size: 16px; box-shadow: 0 4px 0 rgba(36,23,16,.4);
      transition: transform .07s, box-shadow .07s;
    }
    .name-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(36,23,16,.4); }
    .field { margin-bottom: 16px; }
    .field > label { display: block; font-family: var(--disp); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--orange-deep); margin-bottom: 8px; }
    .field input, .field select { width: 100%; padding: 14px; border-radius: 10px; font-family: var(--body-font); font-size: 16px; background: #fffaf0; border: 2px solid var(--brown); color: var(--brown-deep); }
    .field input:focus, .field select:focus { outline: 3px solid var(--gold); outline-offset: 0; border-color: var(--orange); }
    .seg { display: flex; gap: 8px; }
    .seg button { flex: 1; padding: 12px; border-radius: 12px; background: var(--paper-deep); border: 2px solid var(--brown); color: var(--brown); font-family: var(--disp); font-size: 14px; box-shadow: 0 4px 0 rgba(36,23,16,.35); transition: transform .07s, box-shadow .07s; }
    .seg button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(36,23,16,.35); }
    .seg button.on { background: linear-gradient(180deg, #d55f3a, var(--orange)); border-color: var(--orange-deep); color: var(--paper); box-shadow: 0 4px 0 var(--orange-deep); }
    .btn {
      font-family: var(--disp); letter-spacing: .5px; border: 2px solid var(--brown-deep); background: var(--paper-deep); color: var(--brown);
      padding: 15px 16px; border-radius: 12px; font-size: 16px; width: 100%; box-shadow: 0 5px 0 rgba(36,23,16,.4);
      transition: transform .07s, box-shadow .07s, filter .15s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(36,23,16,.4); }
    .btn.primary { background: linear-gradient(180deg, #d55f3a, var(--orange)); border-color: var(--orange-deep); color: var(--paper); box-shadow: 0 5px 0 var(--orange-deep); }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
    .waiting { text-align: center; color: rgba(59,42,30,.78); font-size: 16px; padding: 30px 10px; line-height: 1.6; }
    .waiting .big { font-size: 40px; display: block; margin-bottom: 10px; }
    .waiting b { color: var(--orange-deep); }
    .sent { text-align: center; font-family: var(--disp); color: var(--avocado-deep); font-size: 18px; padding: 24px 10px; }
    .who { text-align: center; color: rgba(59,42,30,.7); font-size: 13px; margin-top: -6px; margin-bottom: 16px; }
    .who b { color: var(--orange-deep); }
    .err { color: var(--orange-deep); font-weight: 700; font-size: 13px; margin-top: 10px; text-align: center; }
    .switch-name { text-align: center; margin-top: 14px; }
    .switch-name button { background: none; border: none; color: rgba(59,42,30,.65); font-size: 12px; text-decoration: underline; }

    /* Light confirm modal on submit (issue #30 item 4). */
    .overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(900px 600px at 50% 8%, rgba(122,69,41,.55), rgba(20,12,8,.95)); padding: 20px; }
    .confirm-panel { width: min(360px, 92vw); }
    .confirm-panel h1 { margin: 0 0 6px; font-family: var(--disp); font-weight: 400; letter-spacing: 1px; font-size: 22px; color: var(--brown); }
    .confirm-panel p { margin: 0 0 16px; color: rgba(59,42,30,.75); font-size: 14px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 12px; }
    .confirm-actions .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="note">♪</span> Hitster bonus guess</div>
    <div class="panel" id="panel">
      <div class="waiting"><span class="big">⏳</span>Loading room...</div>
    </div>
  </div>

  <div class="overlay hidden" id="confirmOverlay">
    <div class="panel confirm-panel">
      <h1 id="confirmTitle">Send this guess?</h1>
      <p id="confirmMsg">You get one bonus guess per round.</p>
      <div class="confirm-actions">
        <button class="btn" id="confirmCancel" type="button">Cancel</button>
        <button class="btn primary" id="confirmOk" type="button">Send</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    function $(id) { return document.getElementById(id); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function qs(name) { var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null; }

    var room = (qs("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    var panel = $("panel");
    var storageKey = "hitster_guess_name_" + room;
    var pollTimer = null;
    var lastSubmittedRound = null;
    var currentState = null;
    var submitting = false;
    var guessType = "artist-title";
    var lastRenderKey = null;

    function render(html) { panel.innerHTML = html; }

    // The render key captures only the fields that decide WHICH screen or
    // form is shown. As long as the key does not change, the poll must not
    // touch the DOM, so a player who is mid-typing never gets wiped out.
    function computeRenderKey(state) {
      var name = chosenName();
      var known = name && state.players.indexOf(name) !== -1;
      var alreadySubmitted = lastSubmittedRound === state.round;
      return [
        known ? "known" : "unknown",
        name || "",
        state.round,
        state.guessOpen ? "1" : "0",
        state.currentPlayer,
        state.hasSource ? "1" : "0",
        alreadySubmitted ? "1" : "0"
      ].join("|");
    }

    // Only rebuilds the DOM when the given key differs from the last one
    // that was actually rendered. Call this from every place that renders
    // in response to polled data (or a transient fetch error) so repeated
    // ticks with unchanged state never disturb inputs the player is typing.
    function applyRender(key, renderFn) {
      if (key === lastRenderKey) return;
      lastRenderKey = key;
      renderFn();
    }

    // Called after a user action (picking/switching name, submitting a
    // guess) that changes what should be shown outside of a poll tick, so
    // the next poll with unchanged state does not redundantly re-render.
    function syncRenderKey() {
      if (currentState) lastRenderKey = computeRenderKey(currentState);
    }

    function renderNoRoom() {
      render('<div class="waiting"><span class="big">🚫</span>No room code in the link. Scan the QR code shown on the main screen.</div>');
    }

    function renderError(msg) {
      render('<div class="waiting"><span class="big">📡</span>' + escapeHtml(msg) + '</div><div class="err">Retrying...</div>');
    }

    function chosenName() {
      try { return localStorage.getItem(storageKey); } catch (e) { return null; }
    }
    function setChosenName(name) {
      try { localStorage.setItem(storageKey, name); } catch (e) { /* ignore, storage unavailable */ }
    }
    function clearChosenName() {
      try { localStorage.removeItem(storageKey); } catch (e) { /* ignore */ }
    }

    function renderPickName(state) {
      var html = '<p class="lede">Tap your name to join the bonus round.</p><div class="names">';
      state.players.forEach(function (p) {
        html += '<button type="button" class="name-btn" data-name="' + escapeHtml(p) + '">' + escapeHtml(p) + '</button>';
      });
      html += '</div>';
      render(html);
      var btns = panel.querySelectorAll(".name-btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].onclick = function (ev) {
          setChosenName(ev.currentTarget.getAttribute("data-name"));
          renderForState(currentState);
          syncRenderKey();
        };
      }
    }

    function renderWaitingTurn(name, state) {
      render(
        '<div class="waiting"><span class="big">👀</span>Watching the main screen.<br />It is <b>' + escapeHtml(state.currentPlayer) + "'s</b> turn.</div>" +
        '<div class="switch-name"><button type="button" id="switchBtn">Not ' + escapeHtml(name) + '? Switch player</button></div>'
      );
      var b = $("switchBtn");
      if (b) b.onclick = function () { clearChosenName(); renderForState(currentState); syncRenderKey(); };
    }

    function renderSent(name) {
      render('<div class="sent">🪙 Sent! Watch the main screen for the result.</div>');
    }

    function renderForm(name, state) {
      var showSource = !!state.hasSource;
      var html = '<div class="who">Playing as <b>' + escapeHtml(name) + '</b>, make your bonus guess.</div>';
      html += '<div class="field"><label>Guess type</label><div class="seg" id="typeSeg">' +
        '<button type="button" data-t="artist-title" class="' + (guessType === "artist-title" ? "on" : "") + '">Artist + title</button>';
      if (showSource) {
        html += '<button type="button" data-t="source" class="' + (guessType === "source" ? "on" : "") + '">Where is it from</button>';
      }
      html += '</div></div>';

      if (guessType === "source" && showSource) {
        html += '<div class="field"><label>Type</label><select id="sourceType">' +
          '<option value="movie">Movie</option><option value="musical">Musical</option><option value="disney">Disney</option></select></div>' +
          '<div class="field"><label>Name (movie / musical title)</label><input id="sourceName" maxlength="60" placeholder="e.g. Titanic" /></div>';
      } else {
        html += '<div class="field"><label>Artist</label><input id="artist" maxlength="60" placeholder="Artist name" /></div>' +
          '<div class="field"><label>Title</label><input id="title" maxlength="60" placeholder="Song title" /></div>';
      }

      html += '<button type="button" class="btn primary" id="submitBtn">Submit bonus guess</button>' +
        '<div class="err hidden" id="formErr"></div>';

      render(html);

      var seg = $("typeSeg");
      if (seg) {
        Array.prototype.slice.call(seg.children).forEach(function (b) {
          b.onclick = function () { guessType = b.getAttribute("data-t"); renderForm(name, state); };
        });
      }
      $("submitBtn").onclick = function () { onSubmitClick(name, state); };
    }

    // Confirm modal: submit is the only committal action on the phone, so a
    // light confirm here is worthwhile (issue #30 item 4). Validate first, so
    // we never confirm an empty form.
    var confirmCb = null;
    function showConfirm(onConfirm) {
      confirmCb = typeof onConfirm === "function" ? onConfirm : null;
      $("confirmOverlay").classList.remove("hidden");
    }
    function hideConfirm() { $("confirmOverlay").classList.add("hidden"); confirmCb = null; }
    $("confirmOk").onclick = function () { var cb = confirmCb; hideConfirm(); if (cb) cb(); };
    $("confirmCancel").onclick = hideConfirm;
    $("confirmOverlay").onclick = function (e) { if (e.target === $("confirmOverlay")) hideConfirm(); };

    function onSubmitClick(name, state) {
      if (submitting) return;
      if (guessType === "source") {
        if (!($("sourceName").value || "").trim()) { showFormErr("Enter the movie, musical, or Disney film name."); return; }
      } else {
        if (!($("artist").value || "").trim() || !($("title").value || "").trim()) { showFormErr("Fill in both artist and title."); return; }
      }
      showConfirm(function () { submitGuess(name, state); });
    }

    function submitGuess(name, state) {
      if (submitting) return;
      var body = { room: room, round: state.round, player: name, type: guessType };
      if (guessType === "source") {
        var sourceType = $("sourceType").value;
        var sourceName = ($("sourceName").value || "").trim();
        if (!sourceName) { showFormErr("Enter the movie, musical, or Disney film name."); return; }
        body.sourceType = sourceType;
        body.sourceName = sourceName;
      } else {
        var artist = ($("artist").value || "").trim();
        var title = ($("title").value || "").trim();
        if (!artist || !title) { showFormErr("Fill in both artist and title."); return; }
        body.artist = artist;
        body.title = title;
      }
      submitting = true;
      fetch("/api/hitster/guess", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function (res) {
        submitting = false;
        if (res.status === 409) { lastSubmittedRound = state.round; renderSent(name); syncRenderKey(); return; }
        if (!res.ok) { showFormErr("Could not send, try again."); return; }
        lastSubmittedRound = state.round;
        renderSent(name);
        syncRenderKey();
      }).catch(function () {
        submitting = false;
        showFormErr("Network error, try again.");
      });
    }

    function showFormErr(msg) {
      var e = $("formErr");
      if (e) { e.textContent = msg; e.classList.remove("hidden"); }
    }

    function renderForState(state) {
      if (!state) { renderError("Waiting for the room to open."); return; }
      var name = chosenName();
      if (!name || state.players.indexOf(name) === -1) { renderPickName(state); return; }
      var myTurn = state.guessOpen && state.currentPlayer === name;
      var alreadySubmitted = lastSubmittedRound === state.round;
      if (myTurn && !alreadySubmitted) { renderForm(name, state); return; }
      if (myTurn && alreadySubmitted) { renderSent(name); return; }
      renderWaitingTurn(name, state);
    }

    function poll() {
      if (!room) return;
      fetch("/api/hitster/room?room=" + encodeURIComponent(room))
        .then(function (res) {
          if (res.status === 404) {
            currentState = null;
            applyRender("error:404", function () { renderError("Room not found yet. Ask the host to start the game."); });
            return null;
          }
          if (res.status === 503) {
            currentState = null;
            applyRender("error:503", function () { renderError("Bonus guesses are not available right now."); });
            return null;
          }
          if (!res.ok) {
            currentState = null;
            applyRender("error:bad-status", function () { renderError("Could not reach the game."); });
            return null;
          }
          return res.json();
        })
        .then(function (state) {
          if (!state) return;
          currentState = state;
          applyRender(computeRenderKey(state), function () { renderForState(state); });
        })
        .catch(function () {
          currentState = null;
          applyRender("error:network", function () { renderError("Could not reach the game."); });
        });
    }

    if (!room) {
      renderNoRoom();
    } else {
      poll();
      pollTimer = setInterval(poll, 2000);
    }
    window.addEventListener("beforeunload", function () { if (pollTimer) clearInterval(pollTimer); });
  })();
  </script>
</body>
</html>
